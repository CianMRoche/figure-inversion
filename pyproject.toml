[project]
name = "figure-inversion"
version = "0.1.0"
description = "Dark-background versions of figures (PDF/SVG/PNG)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["latex", "overleaf", "matplotlib", "dark-mode", "pdf", "svg", "figures"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pikepdf>=8.0",
    "lxml>=5.0",
]

[project.urls]
Homepage = "https://github.com/cianmroche/figure-inversion"
Issues = "https://github.com/cianmroche/figure-inversion/issues"

[project.scripts]
figinvert = "figinvert.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pymupdf>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figinvert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
